plugins {
    id "com.android.application"// Android Gradle Plugin 버전을 7.3.1로 설정
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    compileSdkVersion 34
    namespace = "com.hsj.frontend"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"  // 문자열로 지정
    }

    defaultConfig {
        applicationId "com.hsj.powerclicker"
        minSdkVersion 21  // Flutter 프로젝트에 맞게 적절한 값을 사용하세요
        targetSdkVersion 34  // Flutter 프로젝트에 맞게 적절한 값을 사용하세요
        versionCode 309999
        versionName "3.0"
    }

    def keystorePropertiesFile = file("C:/Users/PRO/Desktop/GitDesktop/Power-Clicker/Frontend/android/app/key.properties")
    def keystoreProperties = [:]

    if (keystorePropertiesFile.exists()) {
        keystorePropertiesFile.withReader { reader ->
            reader.eachLine { line ->
                def (key, value) = line.split('=')
                keystoreProperties[key.trim()] = value.trim()
            }
        }
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']

            println("Keystore storeFile path: " + keystoreProperties['storeFile'])

            if (keystoreProperties['storeFile'] != null && !keystoreProperties['storeFile'].trim().isEmpty()) {
                storeFile file(keystoreProperties['storeFile'])
            }

            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source = "../.."
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.7.3"  // Kotlin 표준 라이브러리 버전을 1.7.3으로 설정
    implementation 'com.google.android.gms:play-services-ads:23.4.0'
}
